[project]
name = "dust-trello-demo"
version = "0.1.0"
description = "Trello support-to-engineering triage with a Dust agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
